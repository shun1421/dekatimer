<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="でかタイマー">
<meta name="theme-color" content="#07060e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
</head>
<body>
<title>でかタイマー</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one-screen app. Thin control bar on top, giant digits in the middle, controls below. Two skins: gaming (single dark neon world) and simple (follows light/dark). */
:root {
  --bg: #f4f6f7; --fg: #14181c; --muted: #5a6570; --line: #d6dce1; --surface: #ffffff;
  --accent: #1d6f63; --accent-fg: #ffffff; --danger: #b8322a;
  --f-digits: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
  --f-ui: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111416; --fg: #eef1f3; --muted: #97a1aa; --line: #2b3137; --surface: #1a1e22;
  --accent: #5cc4b3; --accent-fg: #0b1513; --danger: #ff7a70; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111416; --fg: #eef1f3; --muted: #97a1aa; --line: #2b3137; --surface: #1a1e22;
  --accent: #5cc4b3; --accent-fg: #0b1513; --danger: #ff7a70; color-scheme: dark }
/* gaming skin: one fixed neon world, overrides both themes */
:root.skin-gaming, :root.skin-gaming[data-theme] {
  --bg: #07060e; --fg: #f3f0ff; --muted: #a39cd0; --line: #2c2652; --surface: #120f24;
  --accent: #c04dff; --accent-fg: #ffffff; --danger: #ff3d7f; color-scheme: dark;
  --f-digits: ui-rounded, "SF Pro Rounded", "Hiragino Maru Gothic ProN", system-ui, sans-serif;
}
@property --spin { syntax: "<angle>"; initial-value: 0deg; inherits: false; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-ui); overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app { position: relative; height: 100%; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 16px; gap: 12px; isolation: isolate; }

/* top bar */
.bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface); }
.seg button { border: 0; background: none; padding: 8px 16px; border-radius: 999px; font-size: 15px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.bar-right { display: flex; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-size: 15px;
  display: inline-flex; align-items: center; gap: 6px; max-width: 46vw; }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* stage */
.stage { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh; }
.status { font-size: clamp(14px, 2.2vh, 22px); letter-spacing: .12em; color: var(--muted); height: 1.4em; }
.display { --maxh: 34vh; font-family: var(--f-digits); font-variant-numeric: tabular-nums; font-weight: 600;
  line-height: 1; letter-spacing: -0.02em; white-space: nowrap; text-align: center; position: relative; }
.app[data-state="running"] .display, .app[data-state="paused"] .display, .app[data-state="ringing"] .display { --maxh: 60vh; }
.display[data-len="4"], .display[data-len="5"] { font-size: min(31vw, var(--maxh)); }
.display[data-len="6"] { font-size: min(26vw, var(--maxh)); }
.display[data-len="7"] { font-size: min(23vw, var(--maxh)); }
.display[data-len="8"], .display[data-len="9"] { font-size: min(19vw, var(--maxh)); }
.app[data-state="paused"] #digits { opacity: .45; }

.progress { width: min(100%, 1100px); height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
.fill { height: 100%; width: 100%; background: var(--accent); transform-origin: left; transition: transform .25s linear; }

/* setup */
.setup { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; }
.steppers { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.stepper { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 6px; }
.stepper button { width: 54px; height: 54px; border-radius: 12px; border: 0; background: var(--bg); font-size: 26px; font-weight: 600; }
.stepper .val { min-width: 4.2em; text-align: center; font-size: 18px; font-variant-numeric: tabular-nums; }
.stepper .val b { font-size: 26px; font-weight: 700; }
.presets { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; max-width: 900px; }
.presets button { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 10px 18px; font-size: 17px; }

/* controls */
.controls { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 18px; padding: 16px 28px; font-size: 20px; font-weight: 600; min-width: 130px; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; min-width: 220px; font-size: 24px; }
.btn.stop { background: var(--danger); color: #fff; border-color: transparent; font-size: 30px; padding: 22px 60px; min-width: 280px; }
.app[data-state="idle"] .run-only, .app[data-state="ringing"] .run-only { display: none; }
.app:not([data-state="idle"]) .idle-only { display: none; }
.app:not([data-state="ringing"]) .ring-only { display: none; }
.app[data-state="ringing"] .no-ring { display: none; }

/* ringing (simple): soft accent wash, 1s period */
.app[data-state="ringing"]::after { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--danger); animation: wash 1.2s ease-in-out infinite; pointer-events: none; }
@keyframes wash { 0%,100% { opacity: 0 } 50% { opacity: .18 } }

/* ===== gaming skin ===== */
.skin-gaming body { background: var(--bg); }
.skin-gaming .app::before { content: ""; position: absolute; inset: -20%; z-index: -2; pointer-events: none;
  background: radial-gradient(40% 35% at 20% 30%, rgba(192,77,255,.28), transparent 70%),
              radial-gradient(35% 35% at 80% 70%, rgba(0,229,255,.22), transparent 70%),
              radial-gradient(30% 30% at 60% 15%, rgba(57,255,136,.14), transparent 70%);
  animation: aurora 9s linear infinite; }
@keyframes aurora { to { filter: hue-rotate(360deg); } }
.skin-gaming .app { background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 48px 48px; }
.skin-gaming #digits { background: linear-gradient(90deg, #ff2bd6, #8a5cff, #00e5ff, #39ff88, #ffe600, #ff7a1a, #ff2bd6);
  background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: rgb 5s linear infinite; filter: drop-shadow(0 0 .08em rgba(160,90,255,.55)) drop-shadow(0 0 .02em rgba(0,229,255,.8));
  font-weight: 800; font-style: italic; padding-inline: .06em; }
@keyframes rgb { to { background-position: 300% 0; } }
.skin-gaming .display { padding: .06em .18em; border-radius: .14em; }
.skin-gaming .display::before { content: ""; position: absolute; inset: 0; border-radius: inherit; padding: max(3px, .025em);
  background: conic-gradient(from var(--spin), #ff2bd6, #8a5cff, #00e5ff, #39ff88, #ffe600, #ff2bd6);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
  animation: spin 3s linear infinite; opacity: .9; }
@keyframes spin { to { --spin: 360deg; } }
.skin-gaming .fill { background: linear-gradient(90deg, #ff2bd6, #8a5cff, #00e5ff, #39ff88, #ffe600); box-shadow: 0 0 14px rgba(0,229,255,.7); }
.skin-gaming .progress { background: #1a1533; }
.skin-gaming .btn.primary { background: linear-gradient(90deg, #ff2bd6, #8a5cff, #00b8ff); box-shadow: 0 0 24px rgba(160,90,255,.55); }
.skin-gaming .btn, .skin-gaming .stepper, .skin-gaming .chip, .skin-gaming .seg { box-shadow: inset 0 0 0 1px rgba(160,90,255,.25); }
.skin-gaming .seg button[aria-pressed="true"] { background: linear-gradient(90deg, #ff2bd6, #8a5cff); color: #fff; }
.skin-gaming .presets button:active, .skin-gaming .stepper button:active { background: #2a1f55; box-shadow: 0 0 16px rgba(192,77,255,.6); }
.skin-gaming .status { color: #7ff3ff; text-shadow: 0 0 10px rgba(0,229,255,.7); }
/* last 10 seconds: heartbeat */
.skin-gaming .app.urgent .display { animation: beat 1s ease-in-out infinite; }
@keyframes beat { 0%,100% { transform: scale(1) } 12% { transform: scale(1.05) } 30% { transform: scale(1) } }
.skin-gaming .app.urgent #digits { animation-duration: 1.2s; }
.skin-gaming .app[data-state="ringing"]::after { background: conic-gradient(from 0deg, #ff2bd6, #8a5cff, #00e5ff, #39ff88, #ffe600, #ff2bd6); animation: wash 1.2s ease-in-out infinite; }
.skin-gaming .app[data-state="ringing"] .display { animation: beat 1s ease-in-out infinite; }

@media (prefers-reduced-motion: reduce) {
  .skin-gaming .app::before, .skin-gaming #digits, .skin-gaming .display::before { animation: none; }
  .skin-gaming .app.urgent .display, .skin-gaming .app[data-state="ringing"] .display { animation: none; }
  .app[data-state="ringing"]::after { animation: none; opacity: .12; }
  .fill { transition: none; }
}

/* sound sheet */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: min(680px, 100%); max-height: 88%; overflow-y: auto; background: var(--surface); color: var(--fg); border-radius: 22px 22px 0 0;
  padding: 18px max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 14px; -webkit-user-select: text; user-select: text;
  max-height: 88dvh; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; }
.sheet > * { flex-shrink: 0; }
.sheet h2 { margin: 0; font-size: 20px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; }
.sheet h3 { margin: 6px 0 0; font-size: 13px; letter-spacing: .1em; color: var(--muted); font-weight: 600; }
.list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); min-height: 52px; }
.row:first-child { border-top: 0; }
.row label { flex: 1; display: flex; align-items: center; gap: 12px; font-size: 17px; cursor: pointer; min-width: 0; }
.row input[type="radio"] { width: 22px; height: 22px; accent-color: var(--accent); flex: none; }
.row small { color: var(--muted); font-size: 13px; display: block; overflow: hidden; text-overflow: ellipsis; }
.mini { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 12px; font-size: 14px; flex: none; }
.text { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.help { font-size: 13px; line-height: 1.6; color: var(--muted); margin: 0; }
.vol { display: flex; align-items: center; gap: 12px; }
.vol input { flex: 1; accent-color: var(--accent); }
.done { border: 0; background: var(--accent); color: var(--accent-fg); border-radius: 12px; padding: 10px 20px; font-size: 16px; font-weight: 600; }

@media (max-height: 560px) {
  .stepper button { width: 44px; height: 44px; }
  .btn { padding: 10px 20px; }
  .presets button { padding: 6px 14px; font-size: 15px; }
}
</style>

<div class="app" id="app" data-state="idle">
  <header class="bar">
    <div class="seg" role="group" aria-label="表示スタイル">
      <button type="button" id="skinGaming" aria-pressed="true">ゲーミング</button>
      <button type="button" id="skinSimple" aria-pressed="false">シンプル</button>
    </div>
    <div class="bar-right">
      <button type="button" class="chip" id="soundBtn" aria-label="終了音を選ぶ">♪ <span id="soundName">ベル</span></button>
      <button type="button" class="chip" id="fsBtn">全画面</button>
    </div>
  </header>

  <main class="stage">
    <div class="status" id="status" aria-live="polite"></div>
    <div class="display" id="display" data-len="5"><span id="digits">05:00</span></div>
    <div class="progress run-only" aria-hidden="true"><div class="fill" id="fill"></div></div>

    <div class="setup idle-only">
      <div class="steppers">
        <div class="stepper"><button type="button" data-step="h" data-d="-1" aria-label="時間を減らす">−</button><div class="val"><b id="vh">0</b> 時間</div><button type="button" data-step="h" data-d="1" aria-label="時間を増やす">＋</button></div>
        <div class="stepper"><button type="button" data-step="m" data-d="-1" aria-label="分を減らす">−</button><div class="val"><b id="vm">5</b> 分</div><button type="button" data-step="m" data-d="1" aria-label="分を増やす">＋</button></div>
        <div class="stepper"><button type="button" data-step="s" data-d="-10" aria-label="秒を減らす">−</button><div class="val"><b id="vs">0</b> 秒</div><button type="button" data-step="s" data-d="10" aria-label="秒を増やす">＋</button></div>
      </div>
      <div class="presets" id="presets">
        <button type="button" data-sec="30">30秒</button>
        <button type="button" data-sec="60">1分</button>
        <button type="button" data-sec="180">3分</button>
        <button type="button" data-sec="300">5分</button>
        <button type="button" data-sec="600">10分</button>
        <button type="button" data-sec="900">15分</button>
        <button type="button" data-sec="1800">30分</button>
        <button type="button" data-sec="3000">50分</button>
      </div>
    </div>

    <div class="controls">
      <button type="button" class="btn primary idle-only" id="startBtn">スタート</button>
      <button type="button" class="btn primary run-only" id="pauseBtn">一時停止</button>
      <button type="button" class="btn run-only" id="plusBtn">＋1分</button>
      <button type="button" class="btn run-only" id="resetBtn">リセット</button>
      <button type="button" class="btn stop ring-only" id="stopBtn">止める</button>
    </div>
  </main>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head"><h2 id="sheetTitle">終了音</h2><button type="button" class="done" id="sheetDone">完了</button></div>

    <h3>内蔵サウンド（オフラインで鳴ります）</h3>
    <div class="list" id="builtinList"></div>

    <h3>自分の音楽ファイル</h3>
    <div class="list">
      <div class="row">
        <label><input type="radio" name="snd" value="file" id="r-file"><span style="min-width:0">ファイルの音<small id="fileName">まだ選ばれていません</small></span></label>
        <button type="button" class="mini" id="pickFile">選ぶ</button>
        <button type="button" class="mini" data-preview="file">試聴</button>
      </div>
    </div>
    <input type="file" id="fileInput" accept="audio/*,.mp3,.m4a,.aac,.wav" hidden>
    <p class="help">「ファイル」アプリにあるmp3・m4a・wavを選べます。一度選ぶとこの端末に保存され、オフラインでも鳴ります。</p>

    <h3>Apple Music（ショートカット経由）</h3>
    <div class="list">
      <div class="row">
        <label><input type="radio" name="snd" value="shortcut" id="r-sc"><span>終了時にショートカットを実行</span></label>
      </div>
      <div class="row" style="flex-direction:column;align-items:stretch;gap:8px">
        <input class="text" id="scName" type="text" placeholder="ショートカット名（例：タイマー音楽）" autocomplete="off">
      </div>
    </div>
    <p class="help">ショートカットAppで「ミュージックを再生」アクションに好きな曲を入れたショートカットを作り、その名前を入力してください。タイマーが終わると自動で実行され、Apple Musicの曲が流れます（ショートカットAppに一瞬切り替わります）。</p>

    <h3>音量</h3>
    <div class="vol"><span>小</span><input type="range" id="vol" min="0" max="1" step="0.05" value="0.8" aria-label="音量"><span>大</span></div>
  </div>
</div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const app = $('#app'), digitsEl = $('#digits'), display = $('#display'), fill = $('#fill'), statusEl = $('#status');
  const store = {
    get(k, d) { try { const v = localStorage.getItem('bigtimer.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('bigtimer.' + k, JSON.stringify(v)); } catch (e) {} }
  };

  /* ---------- skin ---------- */
  function setSkin(s) {
    document.documentElement.classList.toggle('skin-gaming', s === 'gaming');
    $('#skinGaming').setAttribute('aria-pressed', s === 'gaming');
    $('#skinSimple').setAttribute('aria-pressed', s !== 'gaming');
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = s === 'gaming' ? '#07060e' : '#111416';
    store.set('skin', s);
  }
  $('#skinGaming').onclick = () => setSkin('gaming');
  $('#skinSimple').onclick = () => setSkin('simple');
  setSkin(store.get('skin', 'gaming'));

  /* ---------- audio ---------- */
  let ctx = null, master = null, vol = store.get('vol', 0.8), ringTimer = null;
  const fileAudio = new Audio(); fileAudio.loop = true; fileAudio.preload = 'auto';
  function ac() {
    if (!ctx) {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
      ctx = new C(); newMaster();
    }
    if (ctx.state !== 'running') ctx.resume();
    return ctx;
  }
  function newMaster() { master = ctx.createGain(); master.gain.value = vol; master.connect(ctx.destination); }
  function note(t, f, d, o = {}) {
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + d * 0.8);
    const peak = o.g ?? 0.25, a = o.a ?? 0.005;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    osc.connect(g); g.connect(master); osc.start(t); osc.stop(t + d + 0.05);
  }
  const SOUNDS = [
    { id: 'bell', name: 'ベル', sub: '澄んだ金属の三連打', period: 3.2, play(t) {
      for (let i = 0; i < 3; i++) { const s = t + i * 0.9; note(s, 880, 2.2, { g: .22 }); note(s, 880 * 2.76, 1.2, { g: .07 }); note(s, 880 * 5.4, .5, { g: .035 }); } } },
    { id: 'chime', name: 'チャイム', sub: 'ドミソドの上り', period: 2.6, play(t) {
      [1046.5, 1318.5, 1568, 2093].forEach((f, i) => { note(t + i * .22, f, 1.6, { g: .18 }); note(t + i * .22, f / 2, 1.2, { type: 'triangle', g: .05 }); }); } },
    { id: 'digital', name: 'デジタル', sub: 'ピピピピッ', period: 1.0, play(t) {
      for (let i = 0; i < 4; i++) note(t + i * .14, 2048, .09, { type: 'square', g: .08, a: .002 }); } },
    { id: 'marimba', name: 'マリンバ', sub: '木の柔らかいメロディ', period: 2.4, play(t) {
      [784, 659.3, 1046.5, 784, 880, 1046.5].forEach((f, i) => { note(t + i * .18, f, .5, { g: .26, a: .003 }); note(t + i * .18, f * 4, .08, { g: .03, a: .001 }); }); } },
    { id: 'retro', name: 'レトロゲーム', sub: '8bitのファンファーレ', period: 1.7, play(t) {
      [523.3, 659.3, 784, 1046.5, 784, 1046.5].forEach((f, i) => note(t + i * .1, f, i === 5 ? .4 : .12, { type: 'square', g: .07, a: .002 })); } },
    { id: 'sonar', name: 'ソナー', sub: 'ポーン…と響く', period: 1.8, play(t) {
      note(t, 1320, 1.2, { g: .25 }); note(t + .35, 1320, .9, { g: .09 }); note(t + .7, 1320, .7, { g: .035 }); } },
    { id: 'rise', name: 'ワープ', sub: '駆け上がる電子音', period: 2.2, play(t) {
      for (let i = 0; i < 3; i++) note(t + i * .45, 400, .4, { type: 'sawtooth', to: 1800, g: .06, a: .01 }); } },
    { id: 'gong', name: 'ゴング', sub: '低く長い余韻', period: 5, play(t) {
      [1, 1.48, 2.02, 2.73, 3.4].forEach((r, i) => note(t, 98 * r, 4.5 - i * .6, { g: [.22, .12, .09, .06, .04][i], a: .012 })); } },
    { id: 'none', name: '無音', sub: '画面の点滅だけ', period: 0, play() {} }
  ];
  let soundId = store.get('sound', 'bell');
  let scName = store.get('scName', '');

  function playPatternOnce(s) { if (!ac()) return; s.play(ctx.currentTime + 0.05); }
  function stopAll() {
    clearInterval(ringTimer); ringTimer = null;
    if (ctx && master) { try { master.disconnect(); } catch (e) {} newMaster(); }
    fileAudio.pause(); try { fileAudio.currentTime = 0; } catch (e) {}
  }
  function openShortcut() {
    if (!scName) return false;
    const a = document.createElement('a');
    a.href = 'shortcuts://run-shortcut?name=' + encodeURIComponent(scName);
    a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
    return true;
  }
  function ring() {
    stopAll();
    if (soundId === 'shortcut') { if (openShortcut()) return; soundId = 'bell'; }
    if (soundId === 'file') {
      if (fileAudio.src) { fileAudio.volume = vol; fileAudio.loop = true; fileAudio.play().catch(() => fallbackRing()); return; }
      return fallbackRing();
    }
    const s = SOUNDS.find(x => x.id === soundId) || SOUNDS[0];
    if (!s.period) return;
    playPatternOnce(s); ringTimer = setInterval(() => playPatternOnce(s), s.period * 1000);
  }
  function fallbackRing() { const s = SOUNDS[0]; playPatternOnce(s); ringTimer = setInterval(() => playPatternOnce(s), s.period * 1000); }
  // Must be called inside a tap so iPad Safari lets sound play later.
  function unlockAudio() {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    const c = ac();
    if (c) { const o = c.createOscillator(), g = c.createGain(); g.gain.value = 0.0001; o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + 0.02); }
    if (soundId === 'file' && fileAudio.src) {
      fileAudio.muted = true;
      fileAudio.play().then(() => { fileAudio.pause(); fileAudio.currentTime = 0; fileAudio.muted = false; }).catch(() => { fileAudio.muted = false; });
    }
  }

  /* custom file kept in IndexedDB */
  const idb = {
    open() { return new Promise((res, rej) => { const r = indexedDB.open('bigtimer', 1); r.onupgradeneeded = () => r.result.createObjectStore('files'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
    async put(v) { const db = await this.open(); return new Promise((res, rej) => { const tx = db.transaction('files', 'readwrite'); tx.objectStore('files').put(v, 'ring'); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); },
    async get() { const db = await this.open(); return new Promise((res, rej) => { const r = db.transaction('files').objectStore('files').get('ring'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
  };
  let fileUrl = null;
  function useBlob(blob, name) {
    if (fileUrl) URL.revokeObjectURL(fileUrl);
    fileUrl = URL.createObjectURL(blob); fileAudio.src = fileUrl;
    $('#fileName').textContent = name; store.set('fileName', name);
  }
  (async () => { try { const v = await idb.get(); if (v && v.blob) useBlob(v.blob, v.name); } catch (e) {} updateSoundLabel(); })();

  /* sound sheet */
  const list = $('#builtinList');
  SOUNDS.forEach(s => {
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<label><input type="radio" name="snd" value="${s.id}"><span>${s.name}<small>${s.sub}</small></span></label>` +
      (s.period ? `<button type="button" class="mini" data-preview="${s.id}">試聴</button>` : '');
    list.appendChild(row);
  });
  function syncRadios() { document.querySelectorAll('input[name="snd"]').forEach(r => r.checked = r.value === soundId); }
  function updateSoundLabel() {
    let n = (SOUNDS.find(x => x.id === soundId) || {}).name;
    if (soundId === 'file') n = store.get('fileName', 'ファイル');
    if (soundId === 'shortcut') n = scName ? '♫ ' + scName : 'ショートカット未設定';
    $('#soundName').textContent = n || 'ベル';
  }
  document.addEventListener('change', e => {
    if (e.target.name === 'snd') {
      soundId = e.target.value; store.set('sound', soundId); updateSoundLabel();
      if (soundId === 'file' && !fileAudio.src) $('#fileInput').click();
      if (soundId === 'shortcut') $('#scName').focus();
    }
  });
  let previewTimer = null;
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-preview]'); if (!b) return;
    stopAll(); clearTimeout(previewTimer);
    const id = b.dataset.preview;
    if (id === 'file') { if (!fileAudio.src) { $('#fileInput').click(); return; } fileAudio.volume = vol; fileAudio.play().catch(() => {}); previewTimer = setTimeout(stopAll, 6000); return; }
    const s = SOUNDS.find(x => x.id === id); if (s) { playPatternOnce(s); }
  });
  $('#pickFile').onclick = () => $('#fileInput').click();
  $('#fileInput').onchange = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    useBlob(f, f.name); soundId = 'file'; store.set('sound', 'file'); syncRadios(); updateSoundLabel();
    try { await idb.put({ blob: f, name: f.name }); } catch (err) { $('#fileName').textContent = f.name + '（この端末に保存できませんでした）'; }
    e.target.value = '';
  };
  $('#scName').value = scName;
  $('#scName').oninput = (e) => { scName = e.target.value.trim(); store.set('scName', scName); updateSoundLabel(); };
  $('#vol').value = vol;
  $('#vol').oninput = (e) => { vol = +e.target.value; store.set('vol', vol); if (master) master.gain.value = vol; fileAudio.volume = vol; };
  function openSheet() { syncRadios(); $('#scrim').hidden = false; ac(); }
  function closeSheet() { stopAll(); $('#scrim').hidden = true; }
  $('#soundBtn').onclick = openSheet;
  $('#sheetDone').onclick = closeSheet;
  $('#scrim').addEventListener('click', e => { if (e.target.id === 'scrim') closeSheet(); });

  /* ---------- timer ---------- */
  let setMs = store.get('setMs', 300000), totalMs = setMs, remaining = setMs, endAt = 0, ringAt = 0, state = 'idle';
  function fmt(ms, up) {
    const sec = up ? Math.floor(ms / 1000) : Math.ceil(ms / 1000);
    const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    const p = (n) => String(n).padStart(2, '0');
    return h ? `${h}:${p(m)}:${p(s)}` : `${p(m)}:${p(s)}`;
  }
  function show(text) {
    if (digitsEl.textContent !== text) { digitsEl.textContent = text; display.dataset.len = text.length; }
  }
  function setState(s) {
    state = s; app.dataset.state = s;
    $('#pauseBtn').textContent = s === 'paused' ? '再開' : '一時停止';
    statusEl.textContent = { idle: '', running: '', paused: '一時停止中', ringing: 'TIME UP' }[s];
    if (s === 'idle' || s === 'ringing') app.classList.remove('urgent');
  }
  function syncSetup() {
    const sec = Math.round(setMs / 1000);
    $('#vh').textContent = Math.floor(sec / 3600); $('#vm').textContent = Math.floor(sec % 3600 / 60); $('#vs').textContent = sec % 60;
    show(fmt(setMs)); store.set('setMs', setMs);
  }
  function setSeconds(sec) { setMs = Math.max(0, Math.min(sec, 99 * 3600 + 59 * 60 + 59)) * 1000; syncSetup(); }
  function stepUnit(unit, d) {
    const sec = Math.round(setMs / 1000);
    let h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
    if (unit === 'h') h = Math.max(0, Math.min(23, h + d));
    if (unit === 'm') m = (m + d + 60) % 60;
    if (unit === 's') s = (s + d + 60) % 60;
    setSeconds(h * 3600 + m * 60 + s);
  }
  // press-and-hold repeat on steppers
  document.querySelectorAll('[data-step]').forEach(b => {
    let t1, t2;
    const go = () => stepUnit(b.dataset.step, +b.dataset.d);
    const stop = () => { clearTimeout(t1); clearInterval(t2); };
    b.addEventListener('pointerdown', (e) => { e.preventDefault(); go(); t1 = setTimeout(() => { t2 = setInterval(go, 90); }, 450); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, stop));
    b.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  });
  $('#presets').addEventListener('click', e => { const b = e.target.closest('[data-sec]'); if (b) setSeconds(+b.dataset.sec); });

  let wake = null;
  async function keepAwake() { try { if ('wakeLock' in navigator && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) {} }
  function releaseWake() { try { wake && wake.release(); } catch (e) {} wake = null; }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { if (state === 'running' || state === 'ringing') keepAwake(); tick(); } });

  function start() {
    if (setMs <= 0) return;
    unlockAudio(); stopAll();
    totalMs = setMs; remaining = setMs; endAt = Date.now() + remaining;
    setState('running'); keepAwake(); tick();
  }
  function togglePause() {
    unlockAudio();
    if (state === 'running') { remaining = Math.max(0, endAt - Date.now()); setState('paused'); }
    else if (state === 'paused') { endAt = Date.now() + remaining; setState('running'); keepAwake(); }
    tick();
  }
  function reset() { stopAll(); setState('idle'); releaseWake(); syncSetup(); fill.style.transform = 'scaleX(1)'; }
  function plusMinute() {
    if (state === 'running') endAt += 60000; else if (state === 'paused') remaining += 60000;
    totalMs += 60000; tick();
  }
  function finish() { remaining = 0; ringAt = endAt; setState('ringing'); fill.style.transform = 'scaleX(0)'; ring(); }

  function tick() {
    const now = Date.now();
    if (state === 'running') {
      remaining = endAt - now;
      if (remaining <= 0) { finish(); }
      else { show(fmt(remaining)); app.classList.toggle('urgent', remaining <= 10000); }
    }
    if (state === 'paused') show(fmt(remaining));
    if (state === 'ringing') show('+' + fmt(now - ringAt, true));
    if (state === 'running' || state === 'paused') fill.style.transform = `scaleX(${Math.max(0, remaining) / totalMs})`;
  }
  (function loop() { tick(); requestAnimationFrame(loop); })();
  setInterval(tick, 250);

  $('#startBtn').onclick = start;
  $('#pauseBtn').onclick = togglePause;
  $('#resetBtn').onclick = reset;
  $('#plusBtn').onclick = plusMinute;
  $('#stopBtn').onclick = reset;
  document.addEventListener('keydown', e => {
    if (!$('#scrim').hidden || e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); state === 'idle' ? start() : state === 'ringing' ? reset() : togglePause(); }
    if (e.key === 'Escape') reset();
  });

  /* fullscreen (hidden when unsupported, e.g. already installed on the home screen) */
  const fsEl = document.documentElement;
  const canFs = fsEl.requestFullscreen || fsEl.webkitRequestFullscreen;
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (!canFs || standalone) $('#fsBtn').hidden = true;
  $('#fsBtn').onclick = () => {
    const inFs = document.fullscreenElement || document.webkitFullscreenElement;
    try {
      if (inFs) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      else { const p = (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl); if (p && p.catch) p.catch(() => {}); }
    } catch (e) {}
  };

  /* offline: register the service worker when installed from its own site */
  if ('serviceWorker' in navigator && location.protocol === 'https:' && document.querySelector('link[rel="manifest"]')) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }

  syncSetup(); updateSoundLabel(); setState('idle');
})();
</script>

</body>
</html>
